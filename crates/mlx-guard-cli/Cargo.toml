[package]
name = "mlx-guard-cli"
description = "Native command shell for mlx-guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "mlx-guard"

# Internal crate: the public surfaces are the CLI, the reports, and the Python package.
publish = false

[[bin]]
name = "mlx-guard"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
mlx-guard-core = { path = "../mlx-guard-core", version = "=0.1.0" }

[dev-dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints]
workspace = true
