name: Release

on:
  push:
    tags:
      - v0.1.0

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release artifacts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020 # 1.93.0
        with:
          components: clippy,rustfmt
      - name: Verify tag and version
        run: |
          test "${GITHUB_REF_NAME}" = "v0.1.0"
          test "$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)" = "${GITHUB_REF_NAME#v}"
      - run: ./scripts/test-full.sh
      - run: ./scripts/build-release.sh dist
      - run: ./scripts/test-wheel.sh dist
      - run: (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mlx-guard-v0.1.0
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mlx-guard/0.1.0/
    permissions:
      id-token: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mlx-guard-v0.1.0
          path: dist
      - name: Verify downloaded artifacts
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/packages/
          attestations: true
