[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "mlx-guard"
dynamic = ["version"]
description = "External runtime safety supervision for MLX workloads on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
authors = [{ name = "IonDen" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
    "Topic :: System :: Monitoring",
]

[project.urls]
Repository = "https://github.com/IonDen/mlx-guard"

[dependency-groups]
dev = [
    "maturin==1.13.3",
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.maturin]
bindings = "bin"
include = [{ path = "LICENSE", format = "sdist" }]
manifest-path = "crates/mlx-guard-cli/Cargo.toml"
python-source = "python"
module-name = "mlx_guard"
strip = true

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "RUF", "S", "SIM", "UP"]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"python/tests/**" = ["D", "S101", "S603"]
