<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1030px;height:547px;background:#FFFFFF;" width="1030px" height="547px" viewBox="0 0 1030 547" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta11?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="261.988" y="22.995" fill="#111827" font-size="14" textLength="499.919" font-weight="700" font-family="Helvetica">Where the enforcement loop runs, and what it shares fate with</text></g><!--cluster domain--><g class="cluster" data-qualified-name="domain" id="ent0002" data-source-line="20"><rect x="132.51" y="191.187" width="592" height="342.48" fill="#FEE2E2" style="stroke:#4B5563;stroke-width:1;" rx="5" ry="5"/><text x="331.084" y="206.182" fill="#111827" font-size="14" textLength="194.852" font-weight="700" font-family="Helvetica">Workload failure domain</text><text x="280.802" y="222.479" fill="#111827" font-size="14" textLength="295.415" font-weight="700" font-family="Helvetica">starved, killed, or panicking together</text></g><!--cluster group--><g class="cluster" data-qualified-name="domain.group" id="ent0003" data-source-line="21"><rect x="164.51" y="258.187" width="528" height="119.59" fill="#FEE2E2" style="stroke:#4B5563;stroke-width:1;" rx="5" ry="5"/><text x="342.709" y="273.182" fill="#111827" font-size="14" textLength="171.603" font-weight="700" font-family="Helvetica">Owned process group</text></g><!--entity inproc--><g class="entity" data-qualified-name="domain.inproc" id="ent0006" data-source-line="25"><rect x="148.24" y="448.777" width="292.535" height="68.891" fill="#FEF3C7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="158.24" y="471.772" fill="#111827" font-size="14" textLength="117.592" font-family="Helvetica">In-process guard</text><text x="158.24" y="488.069" fill="#111827" font-size="14" textLength="272.535" font-family="Helvetica">reads framework counters from inside;</text><text x="158.24" y="504.366" fill="#111827" font-size="14" textLength="200.026" font-family="Helvetica">ends when the process ends</text></g><!--entity root--><g class="entity" data-qualified-name="domain.group.root" id="ent0004" data-source-line="22"><rect x="207.48" y="301.187" width="216.062" height="52.594" fill="#DBEAFE" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="217.48" y="324.182" fill="#111827" font-size="14" textLength="196.062" font-family="Helvetica">Supervised command (root)</text><text x="217.48" y="340.479" fill="#111827" font-size="14" textLength="113.237" font-family="Helvetica">Python and MLX</text></g><!--entity desc--><g class="entity" data-qualified-name="domain.group.desc" id="ent0005" data-source-line="23"><rect x="458.84" y="301.187" width="209.335" height="52.594" fill="#DBEAFE" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="468.84" y="324.182" fill="#111827" font-size="14" textLength="90.993" font-family="Helvetica">Descendants</text><text x="468.84" y="340.479" fill="#111827" font-size="14" textLength="189.335" font-family="Helvetica">dataloader, spawned steps</text></g><!--entity sup--><g class="entity" data-qualified-name="sup" id="ent0001" data-source-line="18"><rect x="7" y="44.297" width="473.024" height="68.891" fill="#DCFCE7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="17" y="67.292" fill="#111827" font-size="14" textLength="444.438" font-family="Helvetica">Supervisor process — native parent, outside the failure domain</text><text x="17" y="83.589" fill="#111827" font-size="14" textLength="431.409" font-family="Helvetica">samples OS-accounted phys_footprint per validated member,</text><text x="17" y="99.886" fill="#111827" font-size="14" textLength="453.024" font-family="Helvetica">runs the policy state machine, writes the journal and final report</text></g><!--entity escaped--><g class="entity" data-qualified-name="escaped" id="ent0008" data-source-line="30"><rect x="740.13" y="448.777" width="276.765" height="68.891" fill="#F3F4F6" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="750.13" y="471.772" fill="#111827" font-size="14" textLength="145.059" font-family="Helvetica">Escaped descendant</text><text x="750.13" y="488.069" fill="#111827" font-size="14" textLength="230.378" font-family="Helvetica">setsid, outside the owned group;</text><text x="750.13" y="504.366" fill="#111827" font-size="14" textLength="256.765" font-family="Helvetica">recorded as evidence, not contained</text></g><!--link group to inproc--><!--link sup to group--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="32" data-link-type="dependency"><path d="M171.05,113.547 C160.39,121.717 150.88,131.537 144.51,143.187 C125.05,178.772 131.53,223.729 143.129,260.213 C148.928,278.455 156.007,294.578 161.763,306.353 C162.483,307.824 163.182,309.228 163.855,310.56 C164.023,310.893 161.92,306.766 162.085,307.09" style="stroke:#4B5563;stroke-width:1;" fill="none" id="sup-to-group"/><polygon points="164.355,311.545,163.833,301.71,162.085,307.09,156.705,305.342,164.355,311.545" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="145.51" y="156.254" fill="#374151" font-size="13" textLength="151.309" font-family="Helvetica">sample every member,</text><text x="170.621" y="171.387" fill="#374151" font-size="13" textLength="101.086" font-family="Helvetica">TERM then KILL</text></g><!--link sup to root--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-source-line="33" data-link-type="dependency"><path d="M281.93,113.607 C289.7,122.437 296.89,132.497 301.51,143.187 C324.2,195.607 322.47,259.358 319.09,295.958" style="stroke:#4B5563;stroke-width:1;" fill="none" id="sup-to-root"/><polygon points="318.63,300.937,323.441,292.343,319.09,295.958,315.475,291.6